  # Order: [cam_high, cam_right_wrist, cam_left_wrist, cam_third_view]
  # DexJoCo cameras: ego / wrist_left / wrist_right (no front).
  camera_active_mask: [1, 1, 1, 0]
  fps: 30
  dataset_root: /mnt/hdd/dexora/data/dexjoco_bimanual_assembly_h264
